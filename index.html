<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quant Interview Trainer</title>
  <meta name="description" content="Practice quant finance interview problems, track your progress, and learn the key ideas." />

  <!-- Apply saved theme before paint to avoid a flash -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem("qt_theme");
        if (t !== "light" && t !== "dark") {
          t = (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches) ? "light" : "dark";
        }
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    })();
  </script>

  <!-- KaTeX for math rendering -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" crossorigin="anonymous" />
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js" crossorigin="anonymous"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js" crossorigin="anonymous"></script>
  <!-- Marked for Markdown -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>

  <link rel="stylesheet" href="css/styles.css?v=3b9f5783ebab" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">∑</span>
      <span id="brand-title" class="brand-title">Quant Interview Trainer</span>
    </div>
    <nav class="topnav">
      <a id="nav-dash" href="#/">Dashboard</a>
      <a id="nav-browse" href="#/browse">Browse</a>
      <a id="nav-list" href="#/list">My List</a>
      <a id="nav-daily" href="#/daily">Daily Question</a>
      <a id="nav-leaderboard" href="#/leaderboard">Leaderboard</a>
    </nav>
    <div class="toolbar">
      <button id="btn-search" class="tool-btn search-trigger" aria-haspopup="dialog" aria-controls="problem-search">
        <span aria-hidden="true">⌕</span><span class="search-trigger-label">Search…</span><kbd>⌘ K</kbd>
      </button>
      <span id="auth-slot" class="auth-slot"></span>
      <button id="btn-lang" class="tool-btn lang-btn" title="切换中文" aria-label="Toggle language">中 / EN</button>
      <button id="btn-theme" class="tool-btn theme-btn" title="Toggle light / dark mode" aria-label="Toggle theme">☀️</button>
      <button id="btn-shortcuts" class="tool-btn" aria-haspopup="dialog" aria-controls="shortcut-settings">Shortcuts</button>
      <button hidden id="btn-export" class="tool-btn" title="Download your progress">Export</button>
      <button hidden id="btn-import" class="tool-btn" title="Load progress from a file">Import</button>
      <button hidden id="btn-reset" class="tool-btn danger" title="Erase all progress">Reset</button>
      <input id="import-file" type="file" accept="application/json" hidden />
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <div id="sidebar-chapters"></div>
    </aside>
    <main id="main" class="main"></main>
  </div>

  <dialog id="problem-search" class="search-dialog" aria-labelledby="search-title">
    <h2 id="search-title" class="sr-only" data-search-text="search.title">Search questions</h2>
    <div class="search-input-row">
      <span class="search-icon" aria-hidden="true">⌕</span>
      <input id="search-query" type="text" role="combobox" aria-autocomplete="list" aria-controls="search-results" aria-expanded="false" maxlength="200" autocomplete="off" spellcheck="false" autofocus />
      <button id="search-clear" class="search-icon-button" type="button" hidden aria-label="Clear search">×</button>
      <button class="search-dismiss" type="button" data-search-close aria-label="Close search"><kbd>Esc</kbd></button>
    </div>
    <div id="search-result-status" class="search-result-status" role="status" aria-live="polite"></div>
    <div id="search-results" role="listbox" aria-label="Search results"></div>
    <p id="search-empty" class="search-empty"></p>
    <div class="search-footer">
      <span><kbd>↑</kbd> <kbd>↓</kbd> <span data-search-text="search.move">Select</span></span>
      <span><kbd>↵</kbd> <span data-search-text="search.openResult">Open</span></span>
      <span data-search-text="search.noAnswers">Answers stay hidden</span>
    </div>
  </dialog>

  <dialog id="shortcut-settings" class="shortcut-dialog" aria-labelledby="shortcut-title" aria-describedby="shortcut-description">
    <div class="shortcut-heading">
      <h2 id="shortcut-title" data-shortcut-text="shortcuts.title">Keyboard shortcuts</h2>
      <button type="button" class="tool-btn" data-shortcut-close data-shortcut-text="shortcuts.close">Close</button>
    </div>
    <p id="shortcut-description" class="subtle" data-shortcut-text="shortcuts.description"></p>
    <div id="shortcut-rows"></div>
    <p class="shortcut-help subtle" data-shortcut-text="shortcuts.help"></p>
    <div class="shortcut-footer">
      <button type="button" class="tool-btn" data-shortcut-reset data-shortcut-text="shortcuts.restore">Restore defaults</button>
      <p id="shortcut-status" role="status" aria-live="polite"></p>
    </div>
  </dialog>

  <!-- Firebase (compat SDK) — powers optional sign-in + discussion forum.
       Harmless if FIREBASE_CONFIG is null; everything else works offline. -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <script src="data/problems.js?v=30406dd14bba"></script>
  <script src="js/i18n.js?v=39668ca15b27"></script>
  <script src="js/storage.js?v=907ee50175d6"></script>
  <script src="js/shortcuts.js?v=1c55b4f23fc0"></script>
  <script src="js/search.js?v=61130e04eeeb"></script>
  <script src="js/firebase-config.js?v=da8c23eb8dae"></script>
  <script src="js/auth.js?v=43ac6366a93c"></script>
  <script src="js/forum.js?v=00c397ed8c61"></script>
  <script src="js/leaderboard.js?v=857b0d67fe15"></script>
  <script src="js/daily.js?v=103053e8fe13"></script>
  <script src="js/app.js?v=ac4275f6a925"></script>
</body>
</html>
